name: "Issue Responder"

# Drafts a first reply to new issues using the Kit's documentation and
# previously resolved issues, generated by GitHub Copilot via
# actions/ai-inference (Copilot CLI provider). See .github/issue-responder/README.md.

on:
  issues:
    types: [opened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: "Issue number to answer"
        required: true
        type: string
      dry_run:
        description: "Log the reply instead of posting it"
        required: false
        type: boolean
        default: true
      force:
        description: "Answer even if the issue is closed or already has comments"
        required: false
        type: boolean
        default: false
      issue_repo:
        description: "Replay an issue from another repo (owner/name). Always a dry run."
        required: false
        type: string
        default: ""

permissions:
  contents: read # read the checked-out documentation files
  issues: write # post comments on issues

concurrency:
  group: issue-responder-${{ inputs.issue_repo || github.repository }}-${{ github.event.issue.number || inputs.issue_number }}
  cancel-in-progress: false

jobs:
  respond:
    runs-on: ubuntu-latest
    # Never react to bots, to avoid reply loops.
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.sender.type != 'Bot' }}
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number || inputs.issue_number }}
      REPO: ${{ github.repository }}
      ISSUE_REPO: ${{ inputs.issue_repo || github.repository }}
      # Past issues searched for answers; the upstream repo has the full history.
      KNOWLEDGE_REPOS: ${{ github.repository }},microsoft/Power-CAT-Copilot-Studio-Kit
      # Repo variable ISSUE_RESPONDER_DRY_RUN=true keeps automatic runs log-only.
      # Replays of another repo's issues are never posted.
      DRY_RUN: ${{ (inputs.issue_repo != '' && inputs.issue_repo != github.repository) && 'true' || github.event_name == 'workflow_dispatch' && (inputs.dry_run && 'true' || 'false') || (vars.ISSUE_RESPONDER_DRY_RUN == 'true' && 'true' || 'false') }}
    steps:
      - name: Check out repository (documentation source)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Gather context (docs + past issues)
        id: gather
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FORCE: ${{ inputs.force }}
        run: node .github/issue-responder/gather.js

      - name: Install Copilot CLI
        if: steps.gather.outputs.skip != 'true'
        run: npm install -g @github/copilot

      - name: Draft reply with Copilot
        id: inference
        if: steps.gather.outputs.skip != 'true'
        uses: actions/ai-inference@2c43c91ae16266ca159d311430343c67a5ffa222 # v3
        with:
          model: "" # empty = let Copilot CLI pick a model available on your plan
          system-prompt-file: _bot/system.txt
          prompt-file: _bot/prompt.txt
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}

      - name: Build comment
        if: steps.gather.outputs.skip != 'true'
        env:
          RESPONSE_FILE: ${{ steps.inference.outputs.response-file }}
        run: |
          {
            cat "$RESPONSE_FILE"
            echo ""
            echo "---"
            echo "<sub>🤖 This is an automated first response based on the Copilot Agent Kit documentation and past issues, so it may be incomplete. A maintainer will follow up.</sub>"
          } > comment.md
          cat comment.md
          cat comment.md >> "$GITHUB_STEP_SUMMARY"

      - name: Post reply
        if: steps.gather.outputs.skip != 'true' && env.DRY_RUN != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh issue comment "$ISSUE_NUMBER" --repo "$REPO" --body-file comment.md
